# ESPHome configuration for Waveshare ESP32-S3-RS485-CAN
# Clean rewrite using custom C++ components
#
# Hardware: Waveshare ESP32-S3-RS485-CAN
# CAN pins: TX=GPIO15, RX=GPIO16 (500kbps Pylontech protocol, listen-only)
# RS485 pins: TX=GPIO17, RX=GPIO18, DE/RE=GPIO21 (9600 baud Pylontech protocol)
#
# MQTT topics match the original implementation for seamless migration.

substitutions:
  device_name: deye-bms-can
  friendly_name: "Deye BMS"
  can_prefix: deye_bms
  rs485_prefix: deye_bms/rs485
  num_batteries: "5"
  pylontech_addr: "2"

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  min_version: "2026.9.1"
  includes:
    - ../../shared/esphome/mqtt_helpers.h
    - ../../shared/esphome/hysteresis.h
    - ../../shared/esphome/availability.h
    - ../../shared/esphome/breadcrumbs.h
    - includes/pylontech_protocol.h
    - includes/pylontech_can.h
    - includes/pylontech_rs485.h
  on_boot:
    priority: -100
    then:
      - lambda: |-
          bc_setup();
      - lambda: |-
          // text_sensor has update_interval: never; without this its state
          // stays blank until someone presses the toggle
          id(debug_level_sensor).publish_state(id(logger_level));
      - lambda: |-
          id(pylontech_can) = (void*) new PylontechCAN("${can_prefix}", ${num_batteries}, "${device_name}/status");
          id(pylontech_rs485) = (void*) new PylontechRS485(id(rs485_uart), "${rs485_prefix}", ${num_batteries}, ${pylontech_addr}, "${device_name}/status");

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf

logger:
  # level is the compile-time ceiling; using initial_level instead of an
  # on_boot downshift, the device boots at WARN with DEBUG compiled in,
  # which the Toggle Debug Logging button can raise at runtime
  level: DEBUG
  initial_level: WARN
  id: logger_level_global

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "${device_name}-fallback"
    password: !secret captive_portal_password

captive_portal:

mqtt:
  id: mqtt_client
  broker: !secret mqtt_host
  port: 1883
  username: !secret mqtt_user
  password: !secret mqtt_password
  # Async enqueue: the loop only copies into the 29-slot pool; a dedicated
  # mqtt task performs the network writes. The loop can no longer block in
  # esp_mqtt_client_publish (the 2026-11-01 watchdog hang class, issue #42).
  # Dropped enqueues are detected via checked discovery results + hysteresis
  # heartbeats.
  idf_send_async: true

  birth_message:
    topic: ${device_name}/status
    payload: "online"
    retain: true
  will_message:
    topic: ${device_name}/status
    payload: "offline"
    retain: true

  # WARN+ log lines → broker; the "BMS Log Tail" HA entity (discovered in
  # pylontech_rs485.h) records them in the always-on HA database. Overnight
  # capture can't depend on a connected log client — laptops sleep.
  log_topic:
    topic: deye_bms/logs
    level: WARN
    retain: false

  discovery: false
  # on_connect trigger doesn't fire reliably on this ESP32-S3 + ESP-IDF build.
  # Discovery publishing is handled by the 3s interval fallback below, which
  # detects MQTT connection and publishes discovery + resets hysteresis.
  reboot_timeout: 0s

api:
  reboot_timeout: 0s
  encryption:
    key: !secret ota_encryption_key

ota:
  - platform: esphome
    encryption:
      key: !secret ota_encryption_key

web_server:
  port: 80
  auth:
    username: !secret web_server_username
    password: !secret web_server_password
    # digest: basic sends the password in easily reversible form over the
    # LAN; digest becomes the ESPHome default in 2027.1.0 - adopt now
    type: digest
  # disable the plaintext /update OTA path - encrypted OTA covers updates,
  # and this endpoint accepted the same image without encryption
  ota: false

uart:
  id: rs485_uart
  tx_pin: GPIO17
  rx_pin: GPIO18
  baud_rate: 9600
  data_bits: 8
  stop_bits: 1
  parity: NONE
  flow_control_pin: GPIO21
  rx_buffer_size: 1024

canbus:
  - platform: esp32_can
    id: can_bus
    tx_pin: GPIO15
    rx_pin: GPIO16
    can_id: 0
    bit_rate: 500kbps
    mode: LISTENONLY
    on_frame:
      - can_id: 0x351
        then:
          - lambda: |-
              if (!id(pylontech_can)) return;
              ((PylontechCAN*)id(pylontech_can))->handle_0x351(x);
      - can_id: 0x355
        then:
          - lambda: |-
              if (!id(pylontech_can)) return;
              ((PylontechCAN*)id(pylontech_can))->handle_0x355(x);
      - can_id: 0x359
        then:
          - lambda: |-
              if (!id(pylontech_can)) return;
              ((PylontechCAN*)id(pylontech_can))->handle_0x359(x);
      - can_id: 0x35C
        then:
          - lambda: |-
              if (!id(pylontech_can)) return;
              ((PylontechCAN*)id(pylontech_can))->handle_0x35C(x);
      - can_id: 0x370
        then:
          - lambda: |-
              if (!id(pylontech_can)) return;
              ((PylontechCAN*)id(pylontech_can))->handle_0x370(x);

globals:
  - id: pylontech_can
    type: void*
    initial_value: 'nullptr'
  - id: pylontech_rs485
    type: void*
    initial_value: 'nullptr'
  - id: logger_level
    type: std::string
    initial_value: '"WARN"'
  - id: discovery_published
    type: bool
    initial_value: 'false'
  - id: mqtt_was_connected
    type: bool
    initial_value: 'false'
  - id: mqtt_disconnect_count
    type: int
    initial_value: '0'

interval:
  - interval: 3s
    then:
      - lambda: |-
          if (!id(pylontech_can) || !id(pylontech_rs485)) return;
          bool connected = id(mqtt_client).is_connected();
          // Note: this poll runs every 3s, so a disconnect shorter than one
          // poll period is invisible here - values lost in such a gap wait
          // for the change/hysteresis heartbeats (60s numerics, 5min strings).
          if (connected) {
            if (id(mqtt_was_connected) && id(mqtt_disconnect_count) > 0) {
              // Short gap (below the 6s debounce): discovery survives retained,
              // but value updates lost during the outage must be re-sent.
              ((PylontechCAN*)id(pylontech_can))->on_short_reconnect();
              ((PylontechRS485*)id(pylontech_rs485))->on_short_reconnect();
            }
            id(mqtt_was_connected) = true;
            id(mqtt_disconnect_count) = 0;
          } else if (id(mqtt_was_connected)) {
            id(mqtt_disconnect_count)++;
            if (id(mqtt_disconnect_count) >= 2) {
              id(discovery_published) = false;
              id(mqtt_was_connected) = false;
            }
          }
          if (!id(discovery_published) && connected) {
            ESP_LOGI("mqtt", "Publishing discovery...");
            bool can_ok = ((PylontechCAN*)id(pylontech_can))->on_mqtt_connect();
            bool rs485_ok = ((PylontechRS485*)id(pylontech_rs485))->on_mqtt_connect();
            // a rejected enqueue (pool full) means an incomplete sweep:
            // stay un-published so the next 3s pass re-drives discovery
            id(discovery_published) = can_ok && rs485_ok;
          }
          bc_report_to_broker(connected);
  - interval: 5s
    then:
      - lambda: |-
          if (!id(pylontech_can)) return;
          ((PylontechCAN*)id(pylontech_can))->check_stale();
  - interval: 10s
    then:
      - lambda: |-
          if (!id(pylontech_can)) return;
          ((PylontechCAN*)id(pylontech_can))->publish_diagnostics();
  - interval: 50ms
    then:
      - lambda: |-
          if (!id(pylontech_rs485)) return;
          ((PylontechRS485*)id(pylontech_rs485))->tick();
  - interval: 30s
    then:
      - lambda: |-
          if (!id(pylontech_rs485)) return;
          ((PylontechRS485*)id(pylontech_rs485))->publish_data();
          ((PylontechRS485*)id(pylontech_rs485))->check_stale();

sensor:
  - platform: wifi_signal
    name: "WiFi Signal"
    update_interval: 60s

  - platform: uptime
    name: "Uptime"

  - platform: template
    name: "Free Heap"
    id: sensor_free_heap
    unit_of_measurement: "bytes"
    icon: "mdi:memory"
    entity_category: diagnostic
    update_interval: 60s
    lambda: 'return heap_caps_get_free_size(MALLOC_CAP_INTERNAL);'

text_sensor:
  - platform: template
    name: "Debug Logging Level"
    id: debug_level_sensor
    icon: "mdi:bug"
    lambda: 'return id(logger_level);'
    update_interval: never

  - platform: version
    name: "ESPHome Version"

binary_sensor:
  - platform: template
    name: "MQTT Connected"
    id: mqtt_connected
    icon: "mdi:cloud-check"
    lambda: 'return id(mqtt_client).is_connected();'

button:
  - platform: restart
    name: "Restart"

  - platform: template
    name: "Re-publish HA Discovery"
    icon: "mdi:home-assistant"
    entity_category: config
    on_press:
      - lambda: |-
          if (!id(pylontech_can) || !id(pylontech_rs485)) return;
          ((PylontechCAN*)id(pylontech_can))->publish_discovery();
          ((PylontechRS485*)id(pylontech_rs485))->publish_discovery();

  - platform: template
    name: "Toggle Debug Logging"
    on_press:
      - lambda: |-
          if (id(logger_level) == "DEBUG") {
            id(logger_level) = "WARN";
            id(logger_level_global).set_log_level(ESPHOME_LOG_LEVEL_WARN);
          } else {
            id(logger_level) = "DEBUG";
            id(logger_level_global).set_log_level(ESPHOME_LOG_LEVEL_DEBUG);
          }
          id(debug_level_sensor).publish_state(id(logger_level));
