# ESPHome configuration for Waveshare ESP32-S3-RS485-CAN
# Clean rewrite using custom C++ components
#
# Hardware: Waveshare ESP32-S3-RS485-CAN
# CAN pins: TX=GPIO15, RX=GPIO16 (500kbps Pylontech protocol, listen-only)
# RS485 pins: TX=GPIO17, RX=GPIO18, DE/RE=GPIO21 (9600 baud Pylontech protocol)
#
# MQTT topics match the original implementation for seamless migration.

substitutions:
  device_name: deye-bms-can
  friendly_name: "Deye BMS"
  can_prefix: deye_bms
  rs485_prefix: deye_bms/rs485
  num_batteries: "5"
  pylontech_addr: "2"

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  min_version: "2026.8.1"
  includes:
    - ../../shared/esphome/mqtt_helpers.h
    - ../../shared/esphome/hysteresis.h
    - ../../shared/esphome/availability.h
    - includes/pylontech_protocol.h
    - includes/pylontech_can.h
    - includes/pylontech_rs485.h
  on_boot:
    priority: -100
    then:
      - lambda: |-
          id(logger_level_global).set_log_level(ESPHOME_LOG_LEVEL_WARN);
          id(logger_level) = "WARN";
          id(debug_level_sensor).publish_state("WARN");
      - lambda: |-
          id(pylontech_can) = (void*) new PylontechCAN("${can_prefix}", ${num_batteries});
          id(pylontech_rs485) = (void*) new PylontechRS485(id(rs485_uart), "${rs485_prefix}", ${num_batteries}, ${pylontech_addr});

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf

logger:
  level: WARN
  id: logger_level_global

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "${device_name}-fallback"
    password: !secret captive_portal_password

captive_portal:

mqtt:
  id: mqtt_client
  broker: !secret mqtt_host
  port: 1883
  username: !secret mqtt_user
  password: !secret mqtt_password

  birth_message:
    topic: ${can_prefix}/status
    payload: "online"
    retain: true
  will_message:
    topic: ${can_prefix}/status
    payload: "offline"
    retain: true

  discovery: false

  on_connect:
    - lambda: |-
        ESP_LOGI("mqtt", "MQTT connected");
        ((PylontechCAN*)id(pylontech_can))->on_mqtt_connect();
        ((PylontechRS485*)id(pylontech_rs485))->on_mqtt_connect();
        ((PylontechCAN*)id(pylontech_can))->publish_discovery();
        ((PylontechRS485*)id(pylontech_rs485))->publish_discovery();

  reboot_timeout: 0s

api:
  reboot_timeout: 0s

ota:
  - platform: esphome
    password: !secret ota_password

web_server:
  port: 80

uart:
  id: rs485_uart
  tx_pin: GPIO17
  rx_pin: GPIO18
  baud_rate: 9600
  data_bits: 8
  stop_bits: 1
  parity: NONE
  flow_control_pin: GPIO21
  rx_buffer_size: 1024

canbus:
  - platform: esp32_can
    id: can_bus
    tx_pin: GPIO15
    rx_pin: GPIO16
    can_id: 0
    bit_rate: 500kbps
    mode: LISTENONLY
    on_frame:
      - can_id: 0x351
        then:
          - lambda: ((PylontechCAN*)id(pylontech_can))->handle_0x351(x);
      - can_id: 0x355
        then:
          - lambda: ((PylontechCAN*)id(pylontech_can))->handle_0x355(x);
      - can_id: 0x359
        then:
          - lambda: ((PylontechCAN*)id(pylontech_can))->handle_0x359(x);
      - can_id: 0x35C
        then:
          - lambda: ((PylontechCAN*)id(pylontech_can))->handle_0x35C(x);
      - can_id: 0x370
        then:
          - lambda: ((PylontechCAN*)id(pylontech_can))->handle_0x370(x);

globals:
  - id: pylontech_can
    type: void*
    initial_value: 'nullptr'
  - id: pylontech_rs485
    type: void*
    initial_value: 'nullptr'
  - id: logger_level
    type: std::string
    initial_value: '"WARN"'

interval:
  - interval: 5s
    then:
      - lambda: ((PylontechCAN*)id(pylontech_can))->check_stale();
  - interval: 10s
    then:
      - lambda: ((PylontechCAN*)id(pylontech_can))->publish_diagnostics();
  - interval: 50ms
    then:
      - lambda: ((PylontechRS485*)id(pylontech_rs485))->tick();
  - interval: 30s
    then:
      - lambda: |-
          ((PylontechRS485*)id(pylontech_rs485))->publish_data();
          ((PylontechRS485*)id(pylontech_rs485))->check_stale();

sensor:
  - platform: wifi_signal
    name: "WiFi Signal"
    update_interval: 60s

  - platform: uptime
    name: "Uptime"

  - platform: template
    name: "Free Heap"
    id: sensor_free_heap
    unit_of_measurement: "bytes"
    icon: "mdi:memory"
    entity_category: diagnostic
    update_interval: 60s
    lambda: 'return heap_caps_get_free_size(MALLOC_CAP_INTERNAL);'

text_sensor:
  - platform: template
    name: "Debug Logging Level"
    id: debug_level_sensor
    icon: "mdi:bug"
    lambda: 'return id(logger_level);'
    update_interval: never

  - platform: version
    name: "ESPHome Version"

binary_sensor:
  - platform: template
    name: "MQTT Connected"
    id: mqtt_connected
    icon: "mdi:cloud-check"
    lambda: 'return id(mqtt_client).is_connected();'

button:
  - platform: restart
    name: "Restart"

  - platform: template
    name: "Re-publish HA Discovery"
    icon: "mdi:home-assistant"
    entity_category: config
    on_press:
      - lambda: |-
          ((PylontechCAN*)id(pylontech_can))->publish_discovery();
          ((PylontechRS485*)id(pylontech_rs485))->publish_discovery();

  - platform: template
    name: "Toggle Debug Logging"
    on_press:
      - lambda: |-
          if (id(logger_level) == "DEBUG") {
            id(logger_level) = "WARN";
            id(logger_level_global).set_log_level(ESPHOME_LOG_LEVEL_WARN);
          } else {
            id(logger_level) = "DEBUG";
            id(logger_level_global).set_log_level(ESPHOME_LOG_LEVEL_DEBUG);
          }
          id(debug_level_sensor).publish_state(id(logger_level));
