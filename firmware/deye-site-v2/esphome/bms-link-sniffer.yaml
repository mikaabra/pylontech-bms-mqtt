# ESPHome configuration for Waveshare ESP32-S3-RS485-CAN
# bms-link-sniffer — passive listener on the BMS073 battery-battery Link bus
# (issue #58; part 2, the guarded balance-voltage write client, is #59)
#
# Hardware: Waveshare ESP32-S3-RS485-CAN, second unit, clipped onto the
# pack-to-pack RS485 chain of the 5-pack Richpower BMS073 stack.
#   RS485: RX=GPIO18, TX=GPIO17, DE/RE=GPIO21 (uart flow_control), 9600 baud
#
# TX GUARANTEE (part 2, #59) — scoped honestly: WHILE THE FIRMWARE RUNS,
# DE/RE (hardwired to GPIO21 on this board) is driven by the uart
# flow_control_pin, asserted only while our own frame is on the wire.
# The write path reaches the UART only through the guarded
# WriteController gates: the Link Write Enable switch below
# (restore_mode ALWAYS_OFF, auto-off after each operation, re-checked at
# every injection state transition), the single-entry write allowlist in
# the pure core (param 0x4C, 3400-3500 mV, packs 01-04 — the same bounds
# as the Mac tool), a one-shot button (one frame per press, presses in
# flight ignored), a >=150 ms..<=250 ms fire window inside a fresh poll
# cadence, and a 6 s arm expiry.
# The four write controls carry state_topic/command_topic: null — the
# supported way to remove their MQTT plumbing entirely (no topics, no
# subscriptions, no discovery; compute_is_internal_() classifies them
# MQTT-internal). Operator reach: the HA ESPHome integration (encrypted
# native API) or the device web server (digest auth, LAN only). Nothing
# broker-side can command the write path.
# Reset window, same honesty as part 1: GPIO21 is unclaimed through the
# ROM bootloader, chip reset, and safe mode, and the write controls do
# not extend that claim; the pre-bus glitch sniff (boots, OTA, forced
# safe-mode boot) is the measurement; external pulldown if it shows
# DE floating high. Part 1 (#58) shipped rx-only; this is that reviewed
# change.
#
# Discovery: native ESPHome MQTT (low-volume diagnostics, ~15 state topics
# at 60 s). The hand-rolled budgeted discovery stream on deye-bms-can exists
# for its ~300-site fleet; nothing here justifies that machinery. If
# first-boot soak shows discovery gaps after reboots (the ESP32-S3/IDF
# on_connect flakiness class), the fallback is deye's 3 s-interval debounced
# republish pattern.

substitutions:
  device_name: bms-link-sniffer
  friendly_name: "BMS Link Sniffer"
  link_prefix: bms_link

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  min_version: "2026.9.1"
  includes:
    - includes/pylontech_protocol.h
    - includes/bms_link_sniffer_core.h
    - includes/bms_link_sniffer.h
  on_boot:
    priority: -100
    then:
      - lambda: |-
          id(link_sniffer) = (void*) new BmsLinkSniffer(id(link_uart));
          ((BmsLinkSniffer*)id(link_sniffer))->bind_entities(id(link_last_anomaly), id(link_anomaly_dump), id(link_write_status), id(link_write_enable));
          ((BmsLinkSniffer*)id(link_sniffer))->bind_read_entities(id(link_read_status), id(pack1_balance_mv), id(pack2_balance_mv), id(pack3_balance_mv), id(pack4_balance_mv));
          ((BmsLinkSniffer*)id(link_sniffer))->bind_debug_entities(id(link_debug_value));

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf

logger:
  level: DEBUG
  initial_level: WARN
  id: logger_level_global

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # mains-powered (USB charger) instrumentation device: keep the radio
  # always on, same rationale as deye-bms-can
  power_save_mode: none
  # review round 3: NEVER reboot on connectivity loss - a network or broker
  # outage must not wipe the RAM incident ring or re-open the unmeasured DE
  # reset window (the 15-minute default reboots the device)
  reboot_timeout: 0s
  ap:
    ssid: "${device_name}-fallback"
    password: !secret captive_portal_password

captive_portal:

mqtt:
  id: mqtt_client
  broker: !secret mqtt_host
  port: 1883
  username: !secret mqtt_user
  password: !secret mqtt_password
  idf_send_async: true
  # same no-reboot rule for broker loss; api: already carries 0s below
  reboot_timeout: 0s

  birth_message:
    topic: ${device_name}/status
    payload: "online"
    retain: true
  will_message:
    topic: ${device_name}/status
    payload: "offline"
    retain: true

  # WARN+ log lines to the broker like deye-bms-can: the Link-bus capture
  # must survive months unattended; nothing may depend on a connected laptop
  log_topic:
    topic: bms_link/logs
    level: WARN
    retain: false
  # feed the WARN stream back into a native text sensor so the always-on
  # HA recorder keeps every anomaly line even if a push entity glitches
  # (the deye device's Log Tail pattern)
  on_message:
    - topic: bms_link/logs
      then:
        - lambda: |-
            id(link_log_tail).publish_state(x);

api:
  reboot_timeout: 0s
  encryption:
    key: !secret ota_encryption_key

ota:
  - platform: esphome
    encryption:
      key: !secret ota_encryption_key

web_server:
  port: 80
  auth:
    username: !secret web_server_username
    password: !secret web_server_password
    type: digest
  ota: false

uart:
  id: link_uart
  rx_pin: GPIO18
  tx_pin: GPIO17
  flow_control_pin: GPIO21
  baud_rate: 9600
  # round 4: never wait indefinitely on a wedged driver - a flush with no
  # timeout would block the main loop until the task watchdog reset, which
  # re-opens the DE/RE window we keep closed
  flush_timeout: 100ms
  data_bits: 8
  stop_bits: 1
  parity: NONE
  rx_buffer_size: 1024

switch:
  - platform: template
    name: "Link Operate Enable"
    id: link_write_enable
    icon: "mdi:shield-key"
    entity_category: config
    optimistic: true
    restore_mode: ALWAYS_OFF
    # local two-step confirm for BOTH tx clients (write + block read):
    # auto-off after every completed operation AND after 5 min of
    # idleness (wrapper), so each write or read needs deliberate
    # re-enabling - the per-operation confirmation analog
    state_topic: null
    command_topic: null

globals:
  - id: link_sniffer
    type: void*
    initial_value: 'nullptr'

interval:
  - interval: 10ms
    then:
      - lambda: |-
          if (id(link_sniffer))
            ((BmsLinkSniffer*)id(link_sniffer))->tick();

sensor:
  - platform: wifi_signal
    name: "WiFi Signal"
    update_interval: 60s

  - platform: uptime
    name: "Uptime"

  - platform: template
    name: "Link Frames Total"
    id: link_frames_total
    entity_category: diagnostic
    update_interval: 60s
    accuracy_decimals: 0
    lambda: |-
      if (!id(link_sniffer)) return {};
      return ((BmsLinkSniffer*)id(link_sniffer))->frames_total();

  - platform: template
    name: "Link Frames per Second"
    id: link_frames_rate
    entity_category: diagnostic
    update_interval: 60s
    accuracy_decimals: 2
    lambda: |-
      if (!id(link_sniffer)) return {};
      return ((BmsLinkSniffer*)id(link_sniffer))->rate_per_s();

  - platform: template
    name: "Link Checksum Errors"
    id: link_checksum_errors
    entity_category: diagnostic
    update_interval: 60s
    accuracy_decimals: 0
    lambda: |-
      if (!id(link_sniffer)) return {};
      return ((BmsLinkSniffer*)id(link_sniffer))->checksum_errors();

  - platform: template
    name: "Link Anomalies Total"
    id: link_anomalies_total
    entity_category: diagnostic
    update_interval: 60s
    accuracy_decimals: 0
    lambda: |-
      if (!id(link_sniffer)) return {};
      return ((BmsLinkSniffer*)id(link_sniffer))->anomalies_total();

  - platform: template
    name: "Link Slot Cadence ms"
    id: link_cadence_ms
    entity_category: diagnostic
    update_interval: 60s
    accuracy_decimals: 0
    lambda: |-
      if (!id(link_sniffer)) return {};
      return ((BmsLinkSniffer*)id(link_sniffer))->cadence_ms();

  - platform: template
    name: "Link Idle Gap Min ms"
    id: link_idle_gap_min
    entity_category: diagnostic
    update_interval: 60s
    accuracy_decimals: 0
    lambda: |-
      if (!id(link_sniffer)) return {};
      return ((BmsLinkSniffer*)id(link_sniffer))->idle_gap_min_ms();

  - platform: template
    name: "Link Idle Gap Avg ms"
    id: link_idle_gap_avg
    entity_category: diagnostic
    update_interval: 60s
    accuracy_decimals: 0
    lambda: |-
      if (!id(link_sniffer)) return {};
      return ((BmsLinkSniffer*)id(link_sniffer))->idle_gap_avg_ms();

  - platform: template
    name: "Pack 1 Response Latency ms"
    id: pack1_latency
    entity_category: diagnostic
    update_interval: 60s
    accuracy_decimals: 0
    lambda: |-
      if (!id(link_sniffer)) return {};
      return ((BmsLinkSniffer*)id(link_sniffer))->pack_latency_ms(1);

  - platform: template
    name: "Pack 1 Last Response Age s"
    id: pack1_age
    entity_category: diagnostic
    update_interval: 60s
    accuracy_decimals: 0
    lambda: |-
      if (!id(link_sniffer)) return {};
      return ((BmsLinkSniffer*)id(link_sniffer))->pack_age_s(1);

  - platform: template
    name: "Pack 2 Response Latency ms"
    id: pack2_latency
    entity_category: diagnostic
    update_interval: 60s
    accuracy_decimals: 0
    lambda: |-
      if (!id(link_sniffer)) return {};
      return ((BmsLinkSniffer*)id(link_sniffer))->pack_latency_ms(2);

  - platform: template
    name: "Pack 2 Last Response Age s"
    id: pack2_age
    entity_category: diagnostic
    update_interval: 60s
    accuracy_decimals: 0
    lambda: |-
      if (!id(link_sniffer)) return {};
      return ((BmsLinkSniffer*)id(link_sniffer))->pack_age_s(2);

  - platform: template
    name: "Pack 3 Response Latency ms"
    id: pack3_latency
    entity_category: diagnostic
    update_interval: 60s
    accuracy_decimals: 0
    lambda: |-
      if (!id(link_sniffer)) return {};
      return ((BmsLinkSniffer*)id(link_sniffer))->pack_latency_ms(3);

  - platform: template
    name: "Pack 3 Last Response Age s"
    id: pack3_age
    entity_category: diagnostic
    update_interval: 60s
    accuracy_decimals: 0
    lambda: |-
      if (!id(link_sniffer)) return {};
      return ((BmsLinkSniffer*)id(link_sniffer))->pack_age_s(3);

  - platform: template
    name: "Pack 4 Response Latency ms"
    id: pack4_latency
    entity_category: diagnostic
    update_interval: 60s
    accuracy_decimals: 0
    lambda: |-
      if (!id(link_sniffer)) return {};
      return ((BmsLinkSniffer*)id(link_sniffer))->pack_latency_ms(4);

  - platform: template
    name: "Pack 4 Last Response Age s"
    id: pack4_age
    entity_category: diagnostic
    update_interval: 60s
    accuracy_decimals: 0
    lambda: |-
      if (!id(link_sniffer)) return {};
      return ((BmsLinkSniffer*)id(link_sniffer))->pack_age_s(4);

  - platform: template
    name: "Link Writes Sent"
    id: link_writes_sent
    entity_category: diagnostic
    update_interval: 60s
    accuracy_decimals: 0
    lambda: |-
      if (!id(link_sniffer)) return {};
      return ((BmsLinkSniffer*)id(link_sniffer))->writes_sent();

  - platform: template
    name: "Link Write Collisions"
    id: link_write_collisions
    entity_category: diagnostic
    update_interval: 60s
    accuracy_decimals: 0
    lambda: |-
      if (!id(link_sniffer)) return {};
      return ((BmsLinkSniffer*)id(link_sniffer))->write_collisions();

  - platform: template
    name: "Link Reads Sent"
    id: link_reads_sent
    entity_category: diagnostic
    update_interval: 60s
    accuracy_decimals: 0
    lambda: |-
      if (!id(link_sniffer)) return {};
      return ((BmsLinkSniffer*)id(link_sniffer))->reads_sent();

  # stored 0x4C per pack, published ONLY from checksum-valid,
  # battery-matched block reads (the strict trust rule) - unknown until
  # that pack's first trusted read
  - platform: template
    name: "Pack 1 Balance Start Voltage mV"
    id: pack1_balance_mv
    entity_category: diagnostic
    unit_of_measurement: "mV"
    accuracy_decimals: 0
    # push-only: the wrapper publishes on a trusted read verdict
    update_interval: never

  - platform: template
    name: "Pack 2 Balance Start Voltage mV"
    id: pack2_balance_mv
    entity_category: diagnostic
    unit_of_measurement: "mV"
    accuracy_decimals: 0
    update_interval: never

  - platform: template
    name: "Pack 3 Balance Start Voltage mV"
    id: pack3_balance_mv
    entity_category: diagnostic
    unit_of_measurement: "mV"
    accuracy_decimals: 0
    update_interval: never

  - platform: template
    name: "Pack 4 Balance Start Voltage mV"
    id: pack4_balance_mv
    entity_category: diagnostic
    unit_of_measurement: "mV"
    accuracy_decimals: 0
    update_interval: never

  - platform: template
    name: "Free Heap"
    id: sensor_free_heap
    unit_of_measurement: "bytes"
    icon: "mdi:memory"
    entity_category: diagnostic
    update_interval: 60s
    lambda: 'return heap_caps_get_free_size(MALLOC_CAP_INTERNAL);'

  - platform: template
    name: "Debug Parameter Value"
    id: link_debug_value
    entity_category: diagnostic
    accuracy_decimals: 0
    # push-only: raw u16 from the last trusted non-balance block read;
    # name/scale/unit live in the Debug Read Parameter select label
    update_interval: never


binary_sensor:
  - platform: template
    name: "Link Slot Watchdog"
    id: link_slot_watchdog
    entity_category: diagnostic
    lambda: |-
      if (!id(link_sniffer)) return {};
      return ((BmsLinkSniffer*)id(link_sniffer))->watchdog();

  - platform: template
    name: "Pack 1 Responding"
    id: pack1_responding
    entity_category: diagnostic
    lambda: |-
      if (!id(link_sniffer)) return {};
      return ((BmsLinkSniffer*)id(link_sniffer))->pack_responding(1);

  - platform: template
    name: "Pack 2 Responding"
    id: pack2_responding
    entity_category: diagnostic
    lambda: |-
      if (!id(link_sniffer)) return {};
      return ((BmsLinkSniffer*)id(link_sniffer))->pack_responding(2);

  - platform: template
    name: "Pack 3 Responding"
    id: pack3_responding
    entity_category: diagnostic
    lambda: |-
      if (!id(link_sniffer)) return {};
      return ((BmsLinkSniffer*)id(link_sniffer))->pack_responding(3);

  - platform: template
    name: "Pack 4 Responding"
    id: pack4_responding
    entity_category: diagnostic
    lambda: |-
      if (!id(link_sniffer)) return {};
      return ((BmsLinkSniffer*)id(link_sniffer))->pack_responding(4);

  - platform: template
    name: "MQTT Connected"
    id: mqtt_connected
    icon: "mdi:cloud-check"
    lambda: 'return id(mqtt_client).is_connected();'

text_sensor:
  - platform: template
    name: "Link Log Tail"
    id: link_log_tail
    icon: "mdi:math-log"
    entity_category: diagnostic
    update_interval: never

  - platform: template
    name: "Link Write Status"
    id: link_write_status
    entity_category: diagnostic
    update_interval: never

  - platform: template
    name: "Link Read Status"
    id: link_read_status
    entity_category: diagnostic
    # push-only: the wrapper publishes the graded block-read verdict
    update_interval: never

  - platform: template
    name: "Link Last Anomaly"
    id: link_last_anomaly
    entity_category: diagnostic
    # push-only: the wrapper publishes on anomaly events
    update_interval: never

  - platform: template
    name: "Link Anomaly Dump"
    id: link_anomaly_dump
    entity_category: diagnostic
    # push-only: the Dump Anomaly Ring button publishes on demand
    update_interval: never

  - platform: version
    name: "ESPHome Version"

number:
  - platform: template
    name: "Balance Start Voltage mV"
    id: link_balance_mv
    icon: "mdi:tune"
    entity_category: config
    min_value: 3400
    max_value: 3500
    step: 10
    initial_value: 3420
    optimistic: true
    restore_value: true
    state_topic: null
    command_topic: null

  - platform: template
    name: "Debug Write Value"
    id: link_debug_write_value
    icon: "mdi:pencil-box-outline"
    entity_category: config
    min_value: 0
    max_value: 65535
    step: 1
    initial_value: 0
    # raw entry in the parameter's native units - the write gates and the
    # select option carry the per-param meaning; restore off: every debug
    # write re-enters its value deliberately
    optimistic: true
    restore_value: false
    state_topic: null
    command_topic: null

select:
  # "None" boots unselected and never restores - a target must be chosen
  # for every session (review round 2: no silent Pack-01 fallback); the
  # single selection drives both the write and the block-read press
  - platform: template
    name: "Target Pack"
    id: link_target_pack
    icon: "mdi:battery"
    entity_category: config
    options:
      - "None"
      - "Pack 01"
      - "Pack 02"
      - "Pack 03"
      - "Pack 04"
    optimistic: true
    initial_option: "None"
    restore_value: false
    state_topic: null
    command_topic: null

  - platform: template
    name: "Debug Read Parameter"
