      - "0x78 PCS power consumption current (x0.001 A)"
      - "0x79 PCS discharge reverse release current (x0.001 A)"
      - "0x7A PCS charging reverse release current (x0.001 A)"
      - "0x7B PCS discharge release delay (S)"
      - "0x7C PCS charging release delay (S)"
    optimistic: true
    initial_option: "0x07 Cell Under Voltage Protect (x0.001 V)"
    # option order == ascending param index over the dense 0x07..0x7C band;
    # gen_param_menus.py refuses to emit anything else - the Read Debug
    # Parameter button maps active_index -> param as 0x07 + index
    restore_value: false
    state_topic: null
    command_topic: null

  - platform: template
    name: "Debug Write Parameter"
    id: link_debug_write_param
    icon: "mdi:tune"
    entity_category: config
    options:
      - "None"
      - "0x4C Start Balance Voltage (3400-3500 mV)"
    optimistic: true
    initial_option: "None"
    # one option per allowlist entry, in allowlist order (reviews add
    # pairs: one kWriteAllowlist line here gets option + mapping line in
    # the Send Debug Parameter Write button)
    restore_value: false
    state_topic: null
    command_topic: null

button:
  # review round 3: restart and dump keep their MQTT command topics by
  # default - a retained PRESS would reboot the device on every broker
  # reconnect (each reboot re-opens the unmeasured DE reset window; a
  # boot loop can end in safe mode with GPIO21 unclaimed for minutes),
  # and a press of Dump releases the incident freeze. Both are
  # MQTT-stripped: operator reach is the HA ESPHome integration (native
  # API) or the device web server (digest auth, LAN only).
  - platform: restart
    name: "Restart"
    state_topic: null
    command_topic: null

  # index 0 is "None" - the wrapper refuses a send without a selection
  - platform: template
    name: "Send Balance Voltage Write"
    icon: "mdi:pencil"
    entity_category: config
    state_topic: null
    command_topic: null
    on_press:
      - lambda: |-
          if (!id(link_sniffer)) return;
          int pack = 0;
          if (id(link_target_pack).active_index().has_value())
            pack = (int)*id(link_target_pack).active_index();
          uint16_t mv = (uint16_t)id(link_balance_mv).state;
          ((BmsLinkSniffer*)id(link_sniffer))->arm_write((uint8_t)pack, mv);

  # the dongle PoC's rs485_verify_write.py on-device: one D547 parameter-
  # block read per press (same Target Pack selection, same Link Operate
  # Enable confirm), graded by the core and reported on Link Read Status;
  # per-pack 0x4C values publish only from checksum-valid, pack-matched
  # blocks. Also the step-4 acceptance proof after a write: ReadOk with
  # the written value = write verified; the ack alone never is.
  - platform: template
    name: "Read Balance Voltage Block"
    icon: "mdi:eye-check-outline"
    entity_category: diagnostic
    state_topic: null
    command_topic: null
    on_press:
      - lambda: |-
          if (!id(link_sniffer)) return;
          int pack = 0;
          if (id(link_target_pack).active_index().has_value())
            pack = (int)*id(link_target_pack).active_index();
          ((BmsLinkSniffer*)id(link_sniffer))->arm_read((uint8_t)pack);

  # the generic half of the read client: any u16 parameter (0x07-0x7C)
  # from the vendor XML menu, one D547 block read per press, graded
  # identically to the balance flow; the raw value lands on Debug
  # Parameter Value and the verdict on Link Read Status
  - platform: template
    name: "Read Debug Parameter"
    icon: "mdi:eye-outline"
    entity_category: diagnostic
    state_topic: null
    command_topic: null
    on_press:
      - lambda: |-
          if (!id(link_sniffer)) return;
          int pack = 0;
          if (id(link_target_pack).active_index().has_value())
            pack = (int)*id(link_target_pack).active_index();
          auto ai = id(link_debug_read_param).active_index();
          if (!ai.has_value()) return;
          uint8_t param = (uint8_t)(0x07 + (int)*ai);
          ((BmsLinkSniffer*)id(link_sniffer))->arm_debug_read((uint8_t)pack, param);

  - platform: template
    name: "Send Debug Parameter Write"
    icon: "mdi:pencil-lock-outline"
    entity_category: config
    state_topic: null
    command_topic: null
    on_press:
      - lambda: |-
          if (!id(link_sniffer)) return;
          int pack = 0;
          if (id(link_target_pack).active_index().has_value())
            pack = (int)*id(link_target_pack).active_index();
          int sel = 0;
          if (id(link_debug_write_param).active_index().has_value())
            sel = (int)*id(link_debug_write_param).active_index();
          uint8_t param = 0;
          if (sel == 1) param = 0x4C;
          uint16_t raw = (uint16_t)id(link_debug_write_value).state;
          ((BmsLinkSniffer*)id(link_sniffer))->arm_debug_write((uint8_t)pack, param, raw);

  - platform: template
    name: "Dump Anomaly Ring"
    icon: "mdi:math-log"
    entity_category: diagnostic
    state_topic: null
    command_topic: null
    on_press:
      - lambda: |-
          if (id(link_sniffer))
            ((BmsLinkSniffer*)id(link_sniffer))->publish_dump();
