    instantaneous_power:
      id: ss_instantaneous_power
      state_topic: null
      on_value:
        then:
          - lambda: 'if (!id(handler_sm)) return; ((SmartShuntHandler*)id(handler_sm))->handle_instantaneous_power(x);'
    battery_temperature:
      id: ss_battery_temperature
      state_topic: null
      on_value:
        then:
          - lambda: 'if (!id(handler_sm)) return; ((SmartShuntHandler*)id(handler_sm))->handle_battery_temperature(x);'
    consumed_amp_hours:
      id: ss_consumed_amp_hours
      state_topic: null
      on_value:
        then:
          - lambda: 'if (!id(handler_sm)) return; ((SmartShuntHandler*)id(handler_sm))->handle_consumed_amp_hours(x);'
    time_to_go:
      id: ss_time_to_go
      state_topic: null
      on_value:
        then:
          - lambda: 'if (!id(handler_sm)) return; ((SmartShuntHandler*)id(handler_sm))->handle_time_to_go(x);'
    depth_of_the_deepest_discharge:
      id: ss_depth_deepest_discharge
      internal: true
      on_value:
        then:
          - lambda: 'if (!id(handler_sm)) return; ((SmartShuntHandler*)id(handler_sm))->handle_depth_deepest_discharge(x);'
    depth_of_the_last_discharge:
      id: ss_depth_last_discharge
      internal: true
      on_value:
        then:
          - lambda: 'if (!id(handler_sm)) return; ((SmartShuntHandler*)id(handler_sm))->handle_depth_last_discharge(x);'
    depth_of_the_average_discharge:
      id: ss_depth_average_discharge
      internal: true
      on_value:
        then:
          - lambda: 'if (!id(handler_sm)) return; ((SmartShuntHandler*)id(handler_sm))->handle_depth_average_discharge(x);'
    number_of_charge_cycles:
      id: ss_number_charge_cycles
      internal: true
      on_value:
        then:
          - lambda: 'if (!id(handler_sm)) return; ((SmartShuntHandler*)id(handler_sm))->handle_number_charge_cycles(x);'
    number_of_full_discharges:
      id: ss_number_full_discharges
      internal: true
      on_value:
        then:
          - lambda: 'if (!id(handler_sm)) return; ((SmartShuntHandler*)id(handler_sm))->handle_number_full_discharges(x);'
    cumulative_amp_hours_drawn:
      id: ss_cumulative_amp_hours
      state_topic: null
      on_value:
        then:
          - lambda: 'if (!id(handler_sm)) return; ((SmartShuntHandler*)id(handler_sm))->handle_cumulative_amp_hours(x);'
    min_battery_voltage:
      id: ss_min_battery_voltage
      state_topic: null
      on_value:
        then:
          - lambda: 'if (!id(handler_sm)) return; ((SmartShuntHandler*)id(handler_sm))->handle_min_battery_voltage(x);'
    max_battery_voltage:
      id: ss_max_battery_voltage
      state_topic: null
      on_value:
        then:
          - lambda: 'if (!id(handler_sm)) return; ((SmartShuntHandler*)id(handler_sm))->handle_max_battery_voltage(x);'
    last_full_charge:
      id: ss_last_full_charge
      state_topic: null
      on_value:
        then:
          - lambda: 'if (!id(handler_sm)) return; ((SmartShuntHandler*)id(handler_sm))->handle_last_full_charge(x);'
    amount_of_discharged_energy:
      id: ss_amount_discharged_energy
      state_topic: null
      on_value:
        then:
          - lambda: 'if (!id(handler_sm)) return; ((SmartShuntHandler*)id(handler_sm))->handle_amount_discharged_energy(x);'
    amount_of_charged_energy:
      id: ss_amount_charged_energy
      state_topic: null
      on_value:
        then:
          - lambda: 'if (!id(handler_sm)) return; ((SmartShuntHandler*)id(handler_sm))->handle_amount_charged_energy(x);'

  # EPEVER sensors (modbus_controller)
  - platform: modbus_controller
    modbus_controller_id: epever
    name: "EPEVER Solar Voltage"
    id: epever_solar_voltage
    state_topic: null
    register_type: read
    address: 12544
    value_type: U_WORD
    unit_of_measurement: "V"
    device_class: voltage
    state_class: measurement
    filters: [multiply: 0.01]
    on_value:
      then:
        - lambda: 'if (!id(handler_ep)) return; ((EPEverHandler*)id(handler_ep))->handle_solar_voltage(x);'

  - platform: modbus_controller
    modbus_controller_id: epever
    name: "EPEVER PV Current"
    id: epever_pv_current
    state_topic: null
    register_type: read
    address: 12545
    value_type: U_WORD
    unit_of_measurement: "A"
    device_class: current
    state_class: measurement
    filters: [multiply: 0.01]
    on_value:
      then:
        - lambda: 'if (!id(handler_ep)) return; ((EPEverHandler*)id(handler_ep))->handle_pv_current(x);'

  - platform: modbus_controller
