# Rack Solar Bridge v2 — Clean rewrite using custom C++ handlers
# ESP32-S3 Waveshare: SmartShunt (VE.Direct) + EPEVER MPPT (RS485/Modbus)
# MQTT topics match the original for seamless migration.

substitutions:
  device_name: rack-solar-bridge
  friendly_name: "Rack Solar Bridge"

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  min_version: "2026.8.1"
  includes:
    - ../../shared/esphome/mqtt_helpers.h
    - ../../shared/esphome/hysteresis.h
    - ../../shared/esphome/availability.h
    - includes/solar_validation.h
    - includes/smartshunt_handler.h
    - includes/epever_handler.h
  on_boot:
    priority: -100
    then:
      - lambda: |-
          id(logger_level_global).set_log_level(ESPHOME_LOG_LEVEL_INFO);
          id(logger_level) = "INFO";
          id(handler_sm) = (void*) new SmartShuntHandler();
          id(handler_ep) = (void*) new EPEverHandler();

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf

logger:
  level: DEBUG
  id: logger_level_global
  baud_rate: 115200

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "${device_name}-fallback"
    password: !secret captive_portal_password

captive_portal:

web_server:
  port: 80

mqtt:
  id: mqtt_client
  broker: !secret mqtt_host
  port: 1883
  username: !secret mqtt_user
  password: !secret mqtt_password
  topic_prefix: "esphome_unused"
  birth_message:
    topic: rack-solar/status
    payload: "online"
    retain: true
  will_message:
    topic: rack-solar/status
    payload: "offline"
    retain: true
  discovery: false
  on_connect:
    - lambda: |-
        ESP_LOGI("mqtt", "MQTT connected");
        ((SmartShuntHandler*)id(handler_sm))->on_mqtt_connect();
        ((EPEverHandler*)id(handler_ep))->on_mqtt_connect();
        ((SmartShuntHandler*)id(handler_sm))->publish_discovery();
        ((EPEverHandler*)id(handler_ep))->publish_discovery();
    - lambda: |-
        // Publish diagnostic discovery
        if (!esphome::mqtt::global_mqtt_client || !esphome::mqtt::global_mqtt_client->is_connected()) return;
        char topic[160], payload[768];
        const char* device_json = R"("device":{"identifiers":["rack_solar_bridge"],"name":"Rack Solar Bridge","model":"Waveshare ESP32-S3","manufacturer":"ESPHome"})";
        const char* diag_avail = R"("availability_topic":"rack-solar/status","payload_available":"online","payload_not_available":"offline")";
        const char* diag_sensors[][5] = {
            {"bitflip_rate", "Bitflip Rate", "events/min", "", ""},
            {"data_quality_score", "Data Quality Score", "%", "", ""},
            {"bitflip_window_total", "Bitflip Window Total", "events", "", ""},
            {"rs485_crc_errors", "RS485 CRC Errors", "", "", ""},
            {"rs485_timeout_errors", "RS485 Timeout Errors", "", "", ""},
            {"rs485_frame_errors", "RS485 Frame Errors", "", "", ""},
            {"smartshunt_stale", "SmartShunt Stale", "", "", ""},
            {"epever_stale", "EPEVER Stale", "", "", ""},
            {"free_heap", "Free Heap", "bytes", "", ""},
            {"wifi_signal", "WiFi Signal", "dBm", "signal_strength", ""},
            {"uptime", "Uptime", "s", "duration", ""},
        };
        for (int i = 0; i < 11; i++) {
            snprintf(topic, sizeof(topic), "homeassistant/sensor/rack_solar/%s/config", diag_sensors[i][0]);
            if (build_ha_sensor_payload(payload, sizeof(payload), diag_sensors[i][0],
                (std::string("rack-solar/") + diag_sensors[i][0]).c_str(),
                (std::string("rack_solar_") + diag_sensors[i][0]).c_str(),
                diag_sensors[i][2], diag_sensors[i][3], "", diag_avail, device_json, "diagnostic")) {
                esphome::mqtt::global_mqtt_client->publish(std::string(topic), std::string(payload), 0, true);
            }
        }
        snprintf(topic, sizeof(topic), "homeassistant/binary_sensor/rack_solar/bitflip_rate_alert/config");
        if (build_ha_binary_sensor_payload(payload, sizeof(payload), "Bitflip Rate Alert",
            "rack-solar/bitflip_rate_alert", "rack_solar_bitflip_rate_alert",
            "problem", "", "ON", "OFF", diag_avail, device_json, "diagnostic")) {
            esphome::mqtt::global_mqtt_client->publish(std::string(topic), std::string(payload), 0, true);
        }
    - mqtt.publish:
        topic: rack-solar/info
        payload: "Rack Solar Bridge v2"
        retain: false
  reboot_timeout: 0s

api:
  reboot_timeout: 0s

ota:
  - platform: esphome
    password: !secret ota_password

# UART interfaces
uart:
  - id: vedirect_uart
    rx_pin:
      number: GPIO5
      mode: INPUT_PULLUP
    baud_rate: 19200
    data_bits: 8
    parity: NONE
    stop_bits: 1
    rx_buffer_size: 1024
  - id: rs485_uart
    tx_pin: GPIO17
    rx_pin: GPIO18
    baud_rate: 115200
    data_bits: 8
    stop_bits: 1
    parity: NONE
    flow_control_pin: GPIO21
    rx_buffer_size: 1024

external_components:
  - source: github://KinDR007/VictronMPPT-ESPHOME@main
    refresh: 0s

victron:
  uart_id: vedirect_uart
  id: smartshunt
  throttle: 1s

modbus:
  id: modbus1
  uart_id: rs485_uart

modbus_controller:
  - id: epever
    address: 0x1
    modbus_id: modbus1
    command_throttle: 0ms
    update_interval: 30s

globals:
  - id: handler_sm
    type: void*
    initial_value: 'nullptr'
  - id: handler_ep
    type: void*
    initial_value: 'nullptr'
  - id: logger_level
    type: std::string
    initial_value: '"INFO"'
  - id: rs485_crc_errors
    type: uint32_t
    initial_value: '0'
    restore_value: true
  - id: rs485_timeout_errors
    type: uint32_t
    initial_value: '0'
    restore_value: true
  - id: rs485_frame_errors
    type: uint32_t
    initial_value: '0'
    restore_value: true

# Text sensors from victron platform
text_sensor:
  - platform: victron
    victron_id: smartshunt
    model_description:
      id: ss_model_description_internal
      on_value:
        then:
          - lambda: ((SmartShuntHandler*)id(handler_sm))->handle_model_description(x);
    firmware_version:
      id: ss_firmware_version_internal
      on_value:
        then:
          - lambda: ((SmartShuntHandler*)id(handler_sm))->handle_firmware_version(x);
    device_type:
      id: ss_device_type_internal
      on_value:
        then:
          - lambda: ((SmartShuntHandler*)id(handler_sm))->handle_device_type(x);
    serial_number:
      id: ss_serial_number_internal
      on_value:
        then:
          - lambda: ((SmartShuntHandler*)id(handler_sm))->handle_serial_number(x);
    dc_monitor_mode:
      id: ss_dc_monitor_mode_internal
      on_value:
        then:
          - lambda: ((SmartShuntHandler*)id(handler_sm))->handle_dc_monitor_mode(x);
    alarm_condition_active:
      id: ss_alarm_condition_internal
      on_value:
        then:
          - lambda: ((SmartShuntHandler*)id(handler_sm))->handle_alarm_condition(x);
    alarm_reason:
      id: ss_alarm_reason_internal
      on_value:
        then:
          - lambda: ((SmartShuntHandler*)id(handler_sm))->handle_alarm_reason(x);

  - platform: version
    name: "ESPHome Version"
    state_topic: null

  - platform: template
    name: "Debug Level"
    id: debug_level_sensor
    state_topic: null
    icon: "mdi:console"
    update_interval: never
    entity_category: diagnostic
    lambda: 'return id(logger_level);'

  - platform: template
    name: "SmartShunt Stale"
    id: smartshunt_stale_sensor
    state_topic: null
    update_interval: 5s
    icon: "mdi:connection"
    entity_category: diagnostic
    lambda: |-
      return ((SmartShuntHandler*)id(handler_sm))->is_stale() ? std::string("STALE") : std::string("OK");
    on_value:
      then:
        - lambda: |-
            static std::string last_val;
            if (x != last_val) {
              last_val = x;
              if (esphome::mqtt::global_mqtt_client && esphome::mqtt::global_mqtt_client->is_connected())
                esphome::mqtt::global_mqtt_client->publish(std::string("rack-solar/smartshunt_stale"), x);
            }

  - platform: template
    name: "EPEVER Stale"
    id: epever_stale_sensor
    state_topic: null
    update_interval: 5s
    icon: "mdi:connection"
    entity_category: diagnostic
    lambda: |-
      return ((EPEverHandler*)id(handler_ep))->is_stale() ? std::string("STALE") : std::string("OK");
    on_value:
      then:
        - lambda: |-
            static std::string last_val;
            if (x != last_val) {
              last_val = x;
              if (esphome::mqtt::global_mqtt_client && esphome::mqtt::global_mqtt_client->is_connected())
                esphome::mqtt::global_mqtt_client->publish(std::string("rack-solar/epever_stale"), x);
            }

binary_sensor:
  - platform: victron
    victron_id: smartshunt
    relay_state:
      id: ss_relay_state_internal
      on_state:
        then:
          - lambda: ((SmartShuntHandler*)id(handler_sm))->handle_relay_state(x);

  - platform: template
    name: "Bitflip Rate Alert"
    id: bitflip_rate_alert
    state_topic: null
    device_class: problem
    entity_category: diagnostic
    lambda: |-
      return ((SmartShuntHandler*)id(handler_sm))->get_bitflip_rate() > 5.0f;
    on_state:
      then:
        - lambda: |-
            const char* payload = x ? "ON" : "OFF";
            if (esphome::mqtt::global_mqtt_client && esphome::mqtt::global_mqtt_client->is_connected())
              esphome::mqtt::global_mqtt_client->publish(std::string("rack-solar/bitflip_rate_alert"), std::string(payload));

# Sensors
sensor:
  - platform: uptime
    name: "Uptime"
    id: uptime_sensor
    state_topic: null
    update_interval: 60s
    device_class: duration
    state_class: total_increasing
    entity_category: diagnostic
    on_value:
      then:
        - lambda: |-
            static int last_uptime = -1;
            int current = (int)x;
            if (current != last_uptime) {
              last_uptime = current;
              if (esphome::mqtt::global_mqtt_client && esphome::mqtt::global_mqtt_client->is_connected())
                esphome::mqtt::global_mqtt_client->publish(std::string("rack-solar/uptime"), to_string(current));
            }

  - platform: wifi_signal
    name: "WiFi Signal"
    id: wifi_signal_db
    state_topic: null
    update_interval: 60s
    unit_of_measurement: "dBm"
    device_class: signal_strength
    on_value:
      then:
        - lambda: |-
            static int last_wifi = -1000;
            int current = (int)x;
            if (current != last_wifi) {
              last_wifi = current;
              if (esphome::mqtt::global_mqtt_client && esphome::mqtt::global_mqtt_client->is_connected())
                esphome::mqtt::global_mqtt_client->publish(std::string("rack-solar/wifi_signal"), to_string(current));
            }

  - platform: template
    name: "Free Heap"
    id: free_heap_sensor
    state_topic: null
    unit_of_measurement: "bytes"
    lambda: 'return (float)heap_caps_get_free_size(MALLOC_CAP_8BIT);'
    update_interval: 30s
    entity_category: diagnostic
    on_value:
      then:
        - lambda: |-
            static int last_heap = -1;
            int current = (int)x;
            if (current != last_heap) {
              last_heap = current;
              if (esphome::mqtt::global_mqtt_client && esphome::mqtt::global_mqtt_client->is_connected())
                esphome::mqtt::global_mqtt_client->publish(std::string("rack-solar/free_heap"), to_string(current));
            }

  - platform: template
    name: "RS485 CRC Errors"
    id: rs485_crc_errors_sensor
    state_topic: null
    lambda: 'return (float)id(rs485_crc_errors);'
    update_interval: 5s
    entity_category: diagnostic
    on_value:
      then:
        - lambda: |-
            static int last_val = -1;
            if ((int)x != last_val) {
              last_val = (int)x;
              if (esphome::mqtt::global_mqtt_client && esphome::mqtt::global_mqtt_client->is_connected())
                esphome::mqtt::global_mqtt_client->publish(std::string("rack-solar/rs485_crc_errors"), to_string((int)x));
            }

  - platform: template
    name: "RS485 Timeout Errors"
    state_topic: null
    lambda: 'return (float)id(rs485_timeout_errors);'
    update_interval: 5s
    entity_category: diagnostic
    on_value:
      then:
        - lambda: |-
            static int last_val = -1;
            if ((int)x != last_val) {
              last_val = (int)x;
              if (esphome::mqtt::global_mqtt_client && esphome::mqtt::global_mqtt_client->is_connected())
                esphome::mqtt::global_mqtt_client->publish(std::string("rack-solar/rs485_timeout_errors"), to_string((int)x));
            }

  - platform: template
    name: "RS485 Frame Errors"
    state_topic: null
    lambda: 'return (float)id(rs485_frame_errors);'
    update_interval: 5s
    entity_category: diagnostic
    on_value:
      then:
        - lambda: |-
            static int last_val = -1;
            if ((int)x != last_val) {
              last_val = (int)x;
              if (esphome::mqtt::global_mqtt_client && esphome::mqtt::global_mqtt_client->is_connected())
                esphome::mqtt::global_mqtt_client->publish(std::string("rack-solar/rs485_frame_errors"), to_string((int)x));
            }

  - platform: template
    name: "Bitflip Rate"
    state_topic: null
    unit_of_measurement: "events/min"
    lambda: 'return ((SmartShuntHandler*)id(handler_sm))->get_bitflip_rate();'
    update_interval: 300s
    state_class: measurement
    entity_category: diagnostic
    on_value:
      then:
        - lambda: |-
            static float last_val = -1.0f;
            if (fabs(x - last_val) > 0.01f) {
              last_val = x;
              char val[16]; snprintf(val, sizeof(val), "%.2f", x);
              if (esphome::mqtt::global_mqtt_client && esphome::mqtt::global_mqtt_client->is_connected())
                esphome::mqtt::global_mqtt_client->publish(std::string("rack-solar/bitflip_rate"), std::string(val));
            }

  - platform: template
    name: "Data Quality Score"
    state_topic: null
    unit_of_measurement: "%"
    lambda: 'return ((SmartShuntHandler*)id(handler_sm))->get_data_quality_score();'
    update_interval: 300s
    state_class: measurement
    entity_category: diagnostic
    on_value:
      then:
        - lambda: |-
            static float last_val = -1.0f;
            if (fabs(x - last_val) > 0.5f) {
              last_val = x;
              char val[16]; snprintf(val, sizeof(val), "%.1f", x);
              if (esphome::mqtt::global_mqtt_client && esphome::mqtt::global_mqtt_client->is_connected())
                esphome::mqtt::global_mqtt_client->publish(std::string("rack-solar/data_quality_score"), std::string(val));
            }

  - platform: template
    name: "Bitflip Window Total"
    state_topic: null
    unit_of_measurement: "events"
    lambda: 'return (float)((SmartShuntHandler*)id(handler_sm))->get_bitflip_count();'
    update_interval: 10s
    state_class: measurement
    entity_category: diagnostic
    on_value:
      then:
        - lambda: |-
            static int last_val = -1;
            int current = (int)x;
            if (current != last_val) {
              last_val = current;
              if (esphome::mqtt::global_mqtt_client && esphome::mqtt::global_mqtt_client->is_connected())
                esphome::mqtt::global_mqtt_client->publish(std::string("rack-solar/bitflip_window_total"), to_string(current));
            }

  # SmartShunt sensors (victron platform)
  - platform: victron
    victron_id: smartshunt
    battery_voltage:
      id: ss_battery_voltage
      state_topic: null
      on_value:
        then:
          - lambda: ((SmartShuntHandler*)id(handler_sm))->handle_battery_voltage(x);
    battery_current:
      id: ss_battery_current
      state_topic: null
      on_value:
        then:
          - lambda: ((SmartShuntHandler*)id(handler_sm))->handle_battery_current(x);
    state_of_charge:
      id: ss_state_of_charge
      state_topic: null
      on_value:
        then:
          - lambda: ((SmartShuntHandler*)id(handler_sm))->handle_state_of_charge(x);
    instantaneous_power:
      id: ss_instantaneous_power
      state_topic: null
      on_value:
        then:
          - lambda: ((SmartShuntHandler*)id(handler_sm))->handle_instantaneous_power(x);
    battery_temperature:
      id: ss_battery_temperature
      state_topic: null
      on_value:
        then:
          - lambda: ((SmartShuntHandler*)id(handler_sm))->handle_battery_temperature(x);
    consumed_amp_hours:
      id: ss_consumed_amp_hours
      state_topic: null
      on_value:
        then:
          - lambda: ((SmartShuntHandler*)id(handler_sm))->handle_consumed_amp_hours(x);
    time_to_go:
      id: ss_time_to_go
      state_topic: null
      on_value:
        then:
          - lambda: ((SmartShuntHandler*)id(handler_sm))->handle_time_to_go(x);
    depth_of_the_deepest_discharge:
      id: ss_depth_deepest_discharge
      internal: true
      on_value:
        then:
          - lambda: ((SmartShuntHandler*)id(handler_sm))->handle_depth_deepest_discharge(x);
    depth_of_the_last_discharge:
      id: ss_depth_last_discharge
      internal: true
      on_value:
        then:
          - lambda: ((SmartShuntHandler*)id(handler_sm))->handle_depth_last_discharge(x);
    depth_of_the_average_discharge:
      id: ss_depth_average_discharge
      internal: true
      on_value:
        then:
          - lambda: ((SmartShuntHandler*)id(handler_sm))->handle_depth_average_discharge(x);
    number_of_charge_cycles:
      id: ss_number_charge_cycles
      internal: true
      on_value:
        then:
          - lambda: ((SmartShuntHandler*)id(handler_sm))->handle_number_charge_cycles(x);
    number_of_full_discharges:
      id: ss_number_full_discharges
      internal: true
      on_value:
        then:
          - lambda: ((SmartShuntHandler*)id(handler_sm))->handle_number_full_discharges(x);
    cumulative_amp_hours_drawn:
      id: ss_cumulative_amp_hours
      state_topic: null
      on_value:
        then:
          - lambda: ((SmartShuntHandler*)id(handler_sm))->handle_cumulative_amp_hours(x);
    min_battery_voltage:
      id: ss_min_battery_voltage
      state_topic: null
      on_value:
        then:
          - lambda: ((SmartShuntHandler*)id(handler_sm))->handle_min_battery_voltage(x);
    max_battery_voltage:
      id: ss_max_battery_voltage
      state_topic: null
      on_value:
        then:
          - lambda: ((SmartShuntHandler*)id(handler_sm))->handle_max_battery_voltage(x);
    last_full_charge:
      id: ss_last_full_charge
      state_topic: null
      on_value:
        then:
          - lambda: ((SmartShuntHandler*)id(handler_sm))->handle_last_full_charge(x);
    amount_of_discharged_energy:
      id: ss_amount_discharged_energy
      state_topic: null
      on_value:
        then:
          - lambda: ((SmartShuntHandler*)id(handler_sm))->handle_amount_discharged_energy(x);
    amount_of_charged_energy:
      id: ss_amount_charged_energy
      state_topic: null
      on_value:
        then:
          - lambda: ((SmartShuntHandler*)id(handler_sm))->handle_amount_charged_energy(x);

  # EPEVER sensors (modbus_controller)
  - platform: modbus_controller
    modbus_controller_id: epever
    name: "EPEVER Solar Voltage"
    id: epever_solar_voltage
    state_topic: null
    register_type: read
    address: 12544
    value_type: U_WORD
    unit_of_measurement: "V"
    device_class: voltage
    state_class: measurement
    filters: [multiply: 0.01]
    on_value:
      then:
        - lambda: ((EPEverHandler*)id(handler_ep))->handle_solar_voltage(x);

  - platform: modbus_controller
    modbus_controller_id: epever
    name: "EPEVER PV Current"
    id: epever_pv_current
    state_topic: null
    register_type: read
    address: 12545
    value_type: U_WORD
    unit_of_measurement: "A"
    device_class: current
    state_class: measurement
    filters: [multiply: 0.01]
    on_value:
      then:
        - lambda: ((EPEverHandler*)id(handler_ep))->handle_pv_current(x);

  - platform: modbus_controller
    modbus_controller_id: epever
    name: "EPEVER Solar Power"
    id: epever_solar_power
    state_topic: null
    register_type: read
    address: 12546
    value_type: U_DWORD_R
    unit_of_measurement: "W"
    device_class: power
    state_class: measurement
    filters: [multiply: 0.01]
    on_value:
      then:
        - lambda: ((EPEverHandler*)id(handler_ep))->handle_solar_power(x);

  - platform: modbus_controller
    modbus_controller_id: epever
    name: "EPEVER Battery Capacity"
    id: epever_battery_capacity
    state_topic: null
    register_type: read
    address: 12570
    value_type: U_WORD
    unit_of_measurement: "%"
    device_class: battery
    state_class: measurement
    on_value:
      then:
        - lambda: ((EPEverHandler*)id(handler_ep))->handle_battery_capacity(x);

  - platform: modbus_controller
    modbus_controller_id: epever
    name: "EPEVER Device Temperature"
    id: epever_device_temp
    state_topic: null
    register_type: read
    address: 12561
    value_type: S_WORD
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    filters: [multiply: 0.01]
    on_value:
      then:
        - lambda: ((EPEverHandler*)id(handler_ep))->handle_device_temp(x);

  - platform: modbus_controller
    modbus_controller_id: epever
    name: "EPEVER Battery Voltage"
    id: epever_battery_voltage
    state_topic: null
    register_type: read
    address: 13082
    value_type: U_WORD
    unit_of_measurement: "V"
    device_class: voltage
    state_class: measurement
    filters: [multiply: 0.01]
    on_value:
      then:
        - lambda: ((EPEverHandler*)id(handler_ep))->handle_battery_voltage(x);

  - platform: modbus_controller
    modbus_controller_id: epever
    name: "EPEVER Battery Current"
    id: epever_battery_current
    state_topic: null
    register_type: read
    address: 13083
    value_type: U_WORD
    unit_of_measurement: "A"
    device_class: current
    state_class: measurement
    filters: [multiply: 0.01]
    on_value:
      then:
        - lambda: ((EPEverHandler*)id(handler_ep))->handle_battery_current(x);

  - platform: modbus_controller
    modbus_controller_id: epever
    name: "EPEVER Total Energy"
    id: epever_total_energy
    state_topic: null
    register_type: read
    address: 13074
    value_type: U_DWORD_R
    unit_of_measurement: "kWh"
    device_class: energy
    state_class: total_increasing
    filters: [multiply: 0.01]
    on_value:
      then:
        - lambda: ((EPEverHandler*)id(handler_ep))->handle_total_energy(x);

interval:
  - interval: 10s
    then:
      - lambda: ((SmartShuntHandler*)id(handler_sm))->check_stale();
  - interval: 30s
    then:
      - lambda: ((EPEverHandler*)id(handler_ep))->check_stale();
  - interval: 10min
    then:
      - lambda: |-
          if (esphome::mqtt::global_mqtt_client && esphome::mqtt::global_mqtt_client->is_connected()) {
            if (!((SmartShuntHandler*)id(handler_sm))->is_stale())
              esphome::mqtt::global_mqtt_client->publish(std::string("rack-solar/smartshunt/status"), std::string("online"), 0, true);
            if (!((EPEverHandler*)id(handler_ep))->is_stale())
              esphome::mqtt::global_mqtt_client->publish(std::string("rack-solar/epever/status"), std::string("online"), 0, true);
          }

button:
  - platform: restart
    name: "Restart"

  - platform: template
    name: "Toggle Debug Level"
    icon: "mdi:toggle-switch"
    on_press:
      - lambda: |-
          if (id(logger_level) == "WARN") {
            id(logger_level_global).set_log_level(ESPHOME_LOG_LEVEL_DEBUG);
            id(logger_level) = "DEBUG";
          } else {
            id(logger_level_global).set_log_level(ESPHOME_LOG_LEVEL_WARN);
            id(logger_level) = "WARN";
          }
          id(debug_level_sensor).publish_state(id(logger_level));
