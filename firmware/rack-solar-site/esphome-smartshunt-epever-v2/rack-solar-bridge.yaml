    address: 12570
    value_type: U_WORD
    unit_of_measurement: "%"
    device_class: battery
    state_class: measurement
    on_value:
      then:
        - lambda: 'if (!id(handler_ep)) return; ((EPEverHandler*)id(handler_ep))->handle_battery_capacity(x);'

  - platform: modbus_controller
    modbus_controller_id: epever
    name: "EPEVER Device Temperature"
    id: epever_device_temp
    state_topic: null
    register_type: read
    address: 12561
    value_type: S_WORD
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    filters: [multiply: 0.01]
    on_value:
      then:
        - lambda: 'if (!id(handler_ep)) return; ((EPEverHandler*)id(handler_ep))->handle_device_temp(x);'

  - platform: modbus_controller
    modbus_controller_id: epever
    name: "EPEVER Battery Voltage"
    id: epever_battery_voltage
    state_topic: null
    register_type: read
    address: 13082
    value_type: U_WORD
    unit_of_measurement: "V"
    device_class: voltage
    state_class: measurement
    filters: [multiply: 0.01]
    on_value:
      then:
        - lambda: 'if (!id(handler_ep)) return; ((EPEverHandler*)id(handler_ep))->handle_battery_voltage(x);'

  - platform: modbus_controller
    modbus_controller_id: epever
    name: "EPEVER Battery Current"
    id: epever_battery_current
    state_topic: null
    register_type: read
    address: 13083
    value_type: U_WORD
    unit_of_measurement: "A"
    device_class: current
    state_class: measurement
    filters: [multiply: 0.01]
    on_value:
      then:
        - lambda: 'if (!id(handler_ep)) return; ((EPEverHandler*)id(handler_ep))->handle_battery_current(x);'

  - platform: modbus_controller
    modbus_controller_id: epever
    name: "EPEVER Total Energy"
    id: epever_total_energy
    state_topic: null
    register_type: read
    address: 13074
    value_type: U_DWORD_R
    unit_of_measurement: "kWh"
    device_class: energy
    state_class: total_increasing
    filters: [multiply: 0.01]
    on_value:
      then:
        - lambda: 'if (!id(handler_ep)) return; ((EPEverHandler*)id(handler_ep))->handle_total_energy(x);'

interval:
  - interval: 3s
    then:
      - lambda: |-
          if (!id(handler_sm) || !id(handler_ep)) return;
          bool connected = esphome::mqtt::global_mqtt_client && esphome::mqtt::global_mqtt_client->is_connected();
          if (connected) {
            id(mqtt_was_connected) = true;
            id(mqtt_disconnect_count) = 0;
          } else if (id(mqtt_was_connected)) {
            id(mqtt_disconnect_count)++;
            if (id(mqtt_disconnect_count) >= 2) {
              id(discovery_published) = false;
              id(mqtt_was_connected) = false;
            }
          }
          if (!id(discovery_published) && connected) {
            id(discovery_published) = true;
            ESP_LOGI("mqtt", "Publishing discovery...");
            ((SmartShuntHandler*)id(handler_sm))->on_mqtt_connect();
            ((EPEverHandler*)id(handler_ep))->on_mqtt_connect();
            esphome::mqtt::global_mqtt_client->publish(std::string("rack-solar/info"), std::string("Rack Solar Bridge v2"));
          }
  - interval: 10s
    then:
      - lambda: |-
          if (!id(handler_sm)) return;
          ((SmartShuntHandler*)id(handler_sm))->check_stale();
  - interval: 30s
    then:
      - lambda: |-
          if (!id(handler_ep)) return;
          ((EPEverHandler*)id(handler_ep))->check_stale();
  - interval: 10min
    then:
      - lambda: |-
          if (!id(handler_sm) || !id(handler_ep)) return;
          if (esphome::mqtt::global_mqtt_client && esphome::mqtt::global_mqtt_client->is_connected()) {
            if (!((SmartShuntHandler*)id(handler_sm))->is_stale())
              esphome::mqtt::global_mqtt_client->publish(std::string("rack-solar/smartshunt/status"), std::string("online"), 0, true);
            if (!((EPEverHandler*)id(handler_ep))->is_stale())
              esphome::mqtt::global_mqtt_client->publish(std::string("rack-solar/epever/status"), std::string("online"), 0, true);
          }

button:
  - platform: restart
    name: "Restart"

  - platform: template
    name: "Toggle Debug Level"
    icon: "mdi:toggle-switch"
    on_press:
      - lambda: |-
          if (id(logger_level) == "WARN") {
            id(logger_level_global).set_log_level(ESPHOME_LOG_LEVEL_DEBUG);
            id(logger_level) = "DEBUG";
          } else {
            id(logger_level_global).set_log_level(ESPHOME_LOG_LEVEL_WARN);
            id(logger_level) = "WARN";
          }
          id(debug_level_sensor).publish_state(id(logger_level));
