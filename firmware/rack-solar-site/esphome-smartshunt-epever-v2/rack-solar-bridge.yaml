    id: epever_solar_power
    state_topic: null
    register_type: read
    address: 12546
    value_type: U_DWORD_R
    unit_of_measurement: "W"
    device_class: power
    state_class: measurement
    filters: [multiply: 0.01]
    on_value:
      then:
        - lambda: 'if (!id(handler_ep)) return; ((EPEverHandler*)id(handler_ep))->handle_solar_power(x);'

  - platform: modbus_controller
