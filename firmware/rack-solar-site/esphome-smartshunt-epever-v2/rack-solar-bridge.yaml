# Rack Solar Bridge v2 — Clean rewrite using custom C++ handlers
# ESP32-S3 Waveshare: SmartShunt (VE.Direct) + EPEVER MPPT (RS485/Modbus)
# MQTT topics match the original for seamless migration.

substitutions:
  device_name: rack-solar-bridge
  friendly_name: "Rack Solar Bridge"

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  min_version: "2026.8.1"
  includes:
    - ../../shared/esphome/mqtt_helpers.h
    - ../../shared/esphome/hysteresis.h
    - ../../shared/esphome/availability.h
    - includes/solar_validation.h
    - includes/smartshunt_handler.h
    - ../../shared/esphome/epever_handler.h
  on_boot:
    priority: -100
    then:
      - lambda: |-
          id(logger_level_global).set_log_level(ESPHOME_LOG_LEVEL_INFO);
          id(logger_level) = "INFO";
          id(handler_sm) = (void*) new SmartShuntHandler();
          id(handler_ep) = (void*) new EPEverHandler();

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf

logger:
  level: DEBUG
  id: logger_level_global
  baud_rate: 115200

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "${device_name}-fallback"
    password: !secret captive_portal_password

captive_portal:

web_server:
  port: 80

mqtt:
  id: mqtt_client
  broker: !secret mqtt_host
  port: 1883
  username: !secret mqtt_user
  password: !secret mqtt_password
  topic_prefix: "esphome_unused"
  birth_message:
    topic: rack-solar/status
    payload: "online"
    retain: true
  will_message:
    topic: rack-solar/status
    payload: "offline"
    retain: true
  discovery: false
  # on_connect trigger doesn't fire reliably on this ESP32-S3 + ESP-IDF build.
  # Discovery publishing is handled by the 3s interval fallback below, which
  # detects MQTT connection and publishes discovery + resets hysteresis.
  reboot_timeout: 0s

api:
  reboot_timeout: 0s

ota:
  - platform: esphome
    password: !secret ota_password

# UART interfaces
uart:
  - id: vedirect_uart
    rx_pin:
      number: GPIO5
      mode: INPUT_PULLUP
    baud_rate: 19200
    data_bits: 8
    parity: NONE
    stop_bits: 1
    rx_buffer_size: 1024
  - id: rs485_uart
    tx_pin: GPIO17
    rx_pin: GPIO18
    baud_rate: 115200
    data_bits: 8
    stop_bits: 1
    parity: NONE
    flow_control_pin: GPIO21
    rx_buffer_size: 1024

external_components:
  - source: github://KinDR007/VictronMPPT-ESPHOME@main
    refresh: 0s

victron:
  uart_id: vedirect_uart
  id: smartshunt
  throttle: 1s

modbus:
  id: modbus1
  uart_id: rs485_uart

modbus_controller:
  - id: epever
    address: 0x1
    modbus_id: modbus1
    command_throttle: 0ms
    update_interval: 30s

globals:
  - id: handler_sm
    type: void*
    initial_value: 'nullptr'
  - id: handler_ep
    type: void*
    initial_value: 'nullptr'
  - id: logger_level
    type: std::string
    initial_value: '"INFO"'
  - id: discovery_published
    type: bool
    initial_value: 'false'
  - id: mqtt_was_connected
    type: bool
    initial_value: 'false'
  - id: mqtt_disconnect_count
    type: int
    initial_value: '0'

# Text sensors from victron platform
text_sensor:
  - platform: victron
    victron_id: smartshunt
    model_description:
      id: ss_model_description_internal
      on_value:
        then:
          - lambda: 'if (!id(handler_sm)) return; ((SmartShuntHandler*)id(handler_sm))->handle_model_description(x);'
    firmware_version:
      id: ss_firmware_version_internal
      on_value:
        then:
          - lambda: 'if (!id(handler_sm)) return; ((SmartShuntHandler*)id(handler_sm))->handle_firmware_version(x);'
    device_type:
      id: ss_device_type_internal
      on_value:
        then:
          - lambda: 'if (!id(handler_sm)) return; ((SmartShuntHandler*)id(handler_sm))->handle_device_type(x);'
    serial_number:
      id: ss_serial_number_internal
      on_value:
        then:
          - lambda: 'if (!id(handler_sm)) return; ((SmartShuntHandler*)id(handler_sm))->handle_serial_number(x);'
    dc_monitor_mode:
      id: ss_dc_monitor_mode_internal
      on_value:
        then:
          - lambda: 'if (!id(handler_sm)) return; ((SmartShuntHandler*)id(handler_sm))->handle_dc_monitor_mode(x);'
    alarm_condition_active:
      id: ss_alarm_condition_internal
      on_value:
        then:
          - lambda: 'if (!id(handler_sm)) return; ((SmartShuntHandler*)id(handler_sm))->handle_alarm_condition(x);'
    alarm_reason:
      id: ss_alarm_reason_internal
      on_value:
        then:
          - lambda: 'if (!id(handler_sm)) return; ((SmartShuntHandler*)id(handler_sm))->handle_alarm_reason(x);'

  - platform: version
    name: "ESPHome Version"
    state_topic: null

  - platform: template
    name: "Debug Level"
    id: debug_level_sensor
    state_topic: null
    icon: "mdi:console"
    update_interval: never
    entity_category: diagnostic
    lambda: 'return id(logger_level);'

  - platform: template
    name: "SmartShunt Stale"
    id: smartshunt_stale_sensor
    state_topic: null
    update_interval: 5s
    icon: "mdi:connection"
    entity_category: diagnostic
    lambda: |-
      return ((SmartShuntHandler*)id(handler_sm))->is_stale() ? std::string("STALE") : std::string("OK");
    on_value:
      then:
        - lambda: |-
            static std::string last_val;
            if (x != last_val) {
              last_val = x;
              if (esphome::mqtt::global_mqtt_client && esphome::mqtt::global_mqtt_client->is_connected())
                esphome::mqtt::global_mqtt_client->publish(std::string("rack-solar/smartshunt_stale"), x);
            }

  - platform: template
    name: "EPEVER Stale"
    id: epever_stale_sensor
    state_topic: null
    update_interval: 5s
    icon: "mdi:connection"
    entity_category: diagnostic
    lambda: |-
      return ((EPEverHandler*)id(handler_ep))->is_stale() ? std::string("STALE") : std::string("OK");
    on_value:
      then:
        - lambda: |-
            static std::string last_val;
            if (x != last_val) {
              last_val = x;
              if (esphome::mqtt::global_mqtt_client && esphome::mqtt::global_mqtt_client->is_connected())
                esphome::mqtt::global_mqtt_client->publish(std::string("rack-solar/epever_stale"), x);
            }

binary_sensor:
  - platform: victron
    victron_id: smartshunt
    relay_state:
      id: ss_relay_state_internal
      on_state:
        then:
          - lambda: 'if (!id(handler_sm)) return; ((SmartShuntHandler*)id(handler_sm))->handle_relay_state(x);'

  - platform: template
    name: "Bitflip Rate Alert"
    id: bitflip_rate_alert
    state_topic: null
    device_class: problem
    entity_category: diagnostic
    lambda: |-
      return id(handler_sm) ? ((SmartShuntHandler*)id(handler_sm))->get_bitflip_rate() > 5.0f : false;
    on_state:
      then:
        - lambda: |-
            const char* payload = x ? "ON" : "OFF";
            if (esphome::mqtt::global_mqtt_client && esphome::mqtt::global_mqtt_client->is_connected())
              esphome::mqtt::global_mqtt_client->publish(std::string("rack-solar/bitflip_rate_alert"), std::string(payload));

# Sensors
sensor:
  - platform: uptime
    name: "Uptime"
    id: uptime_sensor
    state_topic: null
    update_interval: 60s
    device_class: duration
    state_class: total_increasing
    entity_category: diagnostic
    on_value:
      then:
        - lambda: |-
            static int last_uptime = -1;
            int current = (int)x;
            if (current != last_uptime) {
              last_uptime = current;
              if (esphome::mqtt::global_mqtt_client && esphome::mqtt::global_mqtt_client->is_connected())
                esphome::mqtt::global_mqtt_client->publish(std::string("rack-solar/uptime"), to_string(current));
            }

  - platform: wifi_signal
    name: "WiFi Signal"
    id: wifi_signal_db
    state_topic: null
    update_interval: 60s
    unit_of_measurement: "dBm"
    device_class: signal_strength
    on_value:
      then:
        - lambda: |-
            static int last_wifi = -1000;
            int current = (int)x;
            if (current != last_wifi) {
              last_wifi = current;
              if (esphome::mqtt::global_mqtt_client && esphome::mqtt::global_mqtt_client->is_connected())
                esphome::mqtt::global_mqtt_client->publish(std::string("rack-solar/wifi_signal"), to_string(current));
            }

  - platform: template
    name: "Free Heap"
    id: free_heap_sensor
    state_topic: null
    unit_of_measurement: "bytes"
    lambda: 'return (float)heap_caps_get_free_size(MALLOC_CAP_8BIT);'
    update_interval: 30s
    entity_category: diagnostic
    on_value:
      then:
        - lambda: |-
            static int last_heap = -1;
            int current = (int)x;
            if (current != last_heap) {
              last_heap = current;
              if (esphome::mqtt::global_mqtt_client && esphome::mqtt::global_mqtt_client->is_connected())
                esphome::mqtt::global_mqtt_client->publish(std::string("rack-solar/free_heap"), to_string(current));
            }

  - platform: template
    name: "Bitflip Rate"
    state_topic: null
    unit_of_measurement: "events/min"
    lambda: 'return ((SmartShuntHandler*)id(handler_sm))->get_bitflip_rate();'
    update_interval: 300s
    state_class: measurement
    entity_category: diagnostic
    on_value:
      then:
        - lambda: |-
            static float last_val = -1.0f;
            if (fabs(x - last_val) > 0.01f) {
              last_val = x;
              char val[16]; snprintf(val, sizeof(val), "%.2f", x);
              if (esphome::mqtt::global_mqtt_client && esphome::mqtt::global_mqtt_client->is_connected())
                esphome::mqtt::global_mqtt_client->publish(std::string("rack-solar/bitflip_rate"), std::string(val));
            }

  - platform: template
    name: "Data Quality Score"
    state_topic: null
    unit_of_measurement: "%"
    lambda: 'return ((SmartShuntHandler*)id(handler_sm))->get_data_quality_score();'
    update_interval: 300s
    state_class: measurement
    entity_category: diagnostic
    on_value:
      then:
        - lambda: |-
            static float last_val = -1.0f;
            if (fabs(x - last_val) > 0.5f) {
              last_val = x;
              char val[16]; snprintf(val, sizeof(val), "%.1f", x);
              if (esphome::mqtt::global_mqtt_client && esphome::mqtt::global_mqtt_client->is_connected())
                esphome::mqtt::global_mqtt_client->publish(std::string("rack-solar/data_quality_score"), std::string(val));
            }

  - platform: template
    name: "Bitflip Window Total"
    state_topic: null
    unit_of_measurement: "events"
    lambda: 'return (float)((SmartShuntHandler*)id(handler_sm))->get_bitflip_count();'
    update_interval: 10s
    state_class: measurement
    entity_category: diagnostic
    on_value:
      then:
        - lambda: |-
            static int last_val = -1;
            int current = (int)x;
            if (current != last_val) {
              last_val = current;
              if (esphome::mqtt::global_mqtt_client && esphome::mqtt::global_mqtt_client->is_connected())
                esphome::mqtt::global_mqtt_client->publish(std::string("rack-solar/bitflip_window_total"), to_string(current));
            }

  # SmartShunt sensors (victron platform)
  - platform: victron
    victron_id: smartshunt
    battery_voltage:
      id: ss_battery_voltage
      state_topic: null
      on_value:
        then:
          - lambda: 'if (!id(handler_sm)) return; ((SmartShuntHandler*)id(handler_sm))->handle_battery_voltage(x);'
    battery_current:
      id: ss_battery_current
      state_topic: null
      on_value:
        then:
